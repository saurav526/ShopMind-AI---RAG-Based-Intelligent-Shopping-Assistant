name: ShopMind AI — CI Pipeline (Backend Pytest, RAG Eval, Security Audit & Frontend Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests-and-security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate Ground-Truth Evaluation & Product Datasets
        run: python backend/app/database/seed_generator.py

      - name: Run Automated Pytest Suite (RAG, Tools, Evaluation & OWASP Security)
        env:
          PYTHONPATH: backend
        run: pytest backend/tests/test_shopmind.py -v

  frontend-typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build React TypeScript bundle
        working-directory: frontend
        run: |
          npm install
          npm run build
